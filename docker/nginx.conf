worker_processes 1;
error_log /dev/stderr error;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream api {
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
}
