services:
  api1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - INDEX_PATH=/app/index.bin
      - SERVER_PORT=8080
      - NPROBE=8
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - default

  api2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - INDEX_PATH=/app/index.bin
      - SERVER_PORT=8080
      - NPROBE=8
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - default

networks:
  default:
    driver: bridge
