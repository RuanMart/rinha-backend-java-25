services:
  api1:
    image: ghcr.io/ruanmart/rinha-backend-java-25:latest
    environment:
      - INDEX_PATH=/app/index.bin
      - SERVER_PORT=8080
      - NPROBE=8
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - default

  api2:
    image: ghcr.io/ruanmart/rinha-backend-java-25:latest
    environment:
      - INDEX_PATH=/app/index.bin
      - SERVER_PORT=8080
      - NPROBE=8
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - default

networks:
  default:
    driver: bridge
