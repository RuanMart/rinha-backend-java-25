services:
  api1:
    image: ghcr.io/ruanmart/rinha-backend-java-25:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "170MB"

  api2:
    image: ghcr.io/ruanmart/rinha-backend-java-25:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "170MB"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "8MB"
    networks:
      - default

networks:
  default:
    driver: bridge
